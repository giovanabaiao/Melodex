<section id="ajustes"> <!--El id permite que el app.js y el CSS se encuentren-->
  <h1>Ajustes</h1> <!-- Título de la sección de ajustes -->
  
  <div class="ajuste"> </div> <!-- Contenedor de ajustes -->
    <label for="interruptor-tema">Modo oscuro</label> <!-- Texto de la opción -->
    <input type="checkbox" id="interruptor-tema" role="switch"> <!-- El interruptor: el id es como JS lo encuentra, role="switch" indica a 
    lectores de pantalla que es un on/off-->
  </div>
</section>
