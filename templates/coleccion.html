<h2 data-icono="coleccion">Mi Colección</h2>

<!-- Aquí se añadirán los filtros y controles de ordenación. -->
<div id="controles-coleccion" class="panel"></div>

<!-- Distribuye la colección y el panel de detalle. -->
<div class="coleccion-contenido">

  <!-- Lista de items recuperados desde localStorage. -->
  <section id="items-coleccion" class="panel">
    <h3 data-icono="guardadas">Items guardados</h3>

    <div id="lista-coleccion" class="lista-items">
      <p class="vacio">Todavía no has guardado ningún item.</p>
    </div>
  </section>

  <!-- Muestra todas las propiedades del item seleccionado. -->
  <div id="panel-coleccion" class="panel panel-detalle">
    <h3 data-icono="nota">Item seleccionado</h3>

    <div id="detalle-coleccion">
      <p class="vacio">Selecciona un item para ver sus propiedades.</p>
    </div>
  </div>

</div>
