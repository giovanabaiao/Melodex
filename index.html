<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Melodex</title>

  <!-- Estilos generales y variables de colores. -->
  <link rel="stylesheet" href="css/base.css">

  <!-- Componentes reutilizables: tarjetas, paneles y botones. -->
  <link rel="stylesheet" href="css/components.css">

  <!-- Estilos específicos de cada sección. -->
  <link rel="stylesheet" href="css/buscador.css">
  <link rel="stylesheet" href="css/coleccion.css">
  <link rel="stylesheet" href="css/gestionColeccion.css">
  <link rel="stylesheet" href="css/estadisticas.css">
  <link rel="stylesheet" href="css/ajustes.css">
</head>

<body>

  <!-- Cabecera principal de la aplicación. -->
  <header id="cabecera">
    <h1>Melodex</h1>
  </header>

  <!-- Contiene el menú lateral y la sección que se está mostrando. -->
  <div id="contenedor-principal">

    <!-- Cada botón identifica mediante data-seccion la sección que debe abrir. -->
    <nav id="menu-principal" aria-label="Navegación principal">
      <button type="button" data-seccion="inicio" class="active">
        Inicio
      </button>

      <button type="button" data-seccion="buscador">
        Buscador
      </button>

      <button type="button" data-seccion="coleccion">
        Mi Colección
      </button>

      <button type="button" data-seccion="gestionColeccion">
        Gestionar Colección
      </button>

      <button type="button" data-seccion="estadisticas">
        Estadísticas
      </button>

      <button type="button" data-seccion="ajustes">
        Ajustes
      </button>
    </nav>

    <!--
      app.js carga cada plantilla dentro de su sección correspondiente.
      Solamente la sección activa se muestra.
    -->
    <main>
      <section id="seccion-inicio" class="seccion activa">
      </section>

      <section id="seccion-buscador" class="seccion">
      </section>

      <section id="seccion-coleccion" class="seccion">
      </section>

      <section id="seccion-gestionColeccion" class="seccion">
      </section>

      <section id="seccion-estadisticas" class="seccion">
      </section>

      <section id="seccion-ajustes" class="seccion">
      </section>
    </main>

  </div>

  <!-- Pie general de la aplicación. -->
  <footer id="pie">
    <p>Explorador de canciones · Grupo 9</p>
  </footer>

  <!--
    El orden es importante:
    Item debe existir antes de ColeccionStorage.
    app.js se carga al final porque coordina toda la aplicación.
  -->
  <script src="js/item.js"></script>
  <script src="js/coleccionStorage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ajustes.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
